name: Dependency Remediation

on:
  push:
    branches:
      - security/p0-hardening-20260820
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write
  statuses: write

jobs:
  remediate-backend-and-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: security/p0-hardening-20260820

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply non-breaking backend audit fixes
        working-directory: backend
        run: npm audit fix || true

      - name: Verify backend build
        working-directory: backend
        run: npm run build

      - name: Verify backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Apply non-breaking admin audit fixes
        working-directory: admin
        run: npm audit fix || true

      - name: Verify admin typecheck
        working-directory: admin
        run: npm run typecheck

      - name: Verify admin build
        working-directory: admin
        run: npm run build

      - name: Require clean backend and admin audits
        run: |
          set +e
          (cd backend && npm audit --audit-level=moderate)
          backend_audit=$?
          (cd admin && npm audit --audit-level=moderate)
          admin_audit=$?
          if [ "$backend_audit" -ne 0 ] || [ "$admin_audit" -ne 0 ]; then
            echo "Dependency audit remains non-zero (backend=$backend_audit admin=$admin_audit)."
            exit 1
          fi

      - name: Commit verified dependency updates
        run: |
          if git diff --quiet -- backend/package.json backend/package-lock.json admin/package.json admin/package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/package.json backend/package-lock.json admin/package.json admin/package-lock.json
          git commit -m "Harden backend and admin dependency trees"
          git push origin HEAD:security/p0-hardening-20260820

      - name: Publish remediation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'dependency-remediation/backend-admin',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success'
                ? 'Backend/admin dependencies audited and verified'
                : 'Backend/admin dependency remediation failed',
            });
