name: Security Hardening

on:
  push:
    branches:
      - security/p0-hardening-20260820
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run focused security regression tests
        run: npm test -- --runInBand register.dto.security.spec.ts auth.controller.security.spec.ts users.service.security.spec.ts roles.guard.security.spec.ts payments.service.security.spec.ts

      - name: Publish backend security status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'security-hardening/backend',
              description: state === 'success'
                ? 'Focused backend security regressions passed'
                : 'Focused backend security regressions failed',
            });
